name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Check lint and formatting
        run: |
          python -m ruff check backend
          python -m ruff format --check backend
      - name: Run backend tests
        run: python -m pytest backend/tests -q
      - name: Compile backend Python
        run: python -m compileall -q backend
      - name: Build and validate Lambda package
        run: |
          python -m backend.build_lambda --output backend/build/solarloss-lambda.zip
          python -m backend.validate_lambda_package backend/build/solarloss-lambda.zip
