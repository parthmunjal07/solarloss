name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
        working-directory: web
      - name: Lint
        run: npm run lint
        working-directory: web
      - name: Type-check
        run: npm run typecheck
        working-directory: web
      - name: Run unit tests
        run: npm test
        working-directory: web
      - name: Build production frontend
        run: npm run build
        working-directory: web
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Run browser smoke tests
        run: npm run test:e2e
        working-directory: web
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend dependencies for real local API verification
        run: python -m pip install -r backend/requirements.txt
      - name: Verify approved artifact through the real local API and frontend
        run: npm run test:api
        working-directory: web
